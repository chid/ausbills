[project]
name = "ausbills"
version = "2.0.0"
description = "Get current bills from Australian parliaments."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenGov Australia", email = "kip.crossing@gmail.com" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "requests>=2.31",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
test = ["pytest>=7"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
testpaths = ["tests"]
markers = [
    "live: opt-in live smoke tests that call official source sites",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
